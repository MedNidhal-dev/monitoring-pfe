version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: monitoring_postgres
    restart: always
    environment:
      POSTGRES_USER: logstash_user
      POSTGRES_PASSWORD: Nidhal123
      POSTGRES_DB: monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: monitoring_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    image: ${NEXUS_REGISTRY:-192.168.75.1:8082}/monitoring-backend:latest
    container_name: monitoring_backend
    restart: always
    ports:
      - "3001:3000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    networks:
      default:
        aliases:
          - backend

  ai-module:
    image: ${NEXUS_REGISTRY:-192.168.75.1:8082}/monitoring-ai:latest
    container_name: monitoring_ai
    restart: always
    ports:
      - "5001:5001"
    env_file: ./ai-module/.env
    depends_on:
      - backend
      - postgres

  frontend:
    image: ${NEXUS_REGISTRY:-192.168.75.1:8082}/monitoring-frontend:latest
    container_name: monitoring_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
